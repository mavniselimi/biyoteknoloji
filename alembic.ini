# Alembic configuration (WP-02).
#
# There is no credential here on purpose. The database URL is resolved at
# runtime by migrations/env.py from DATABASE_URL (or TEST_DATABASE_URL when
# PGX_ALEMBIC_USE_TEST_DATABASE=1), so no secret is ever source-controlled.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally left empty - see migrations/env.py.
sqlalchemy.url =

[post_write_hooks]
# No automatic formatting hook: migrations are reviewed by hand, never left as
# blind autogenerate output.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
